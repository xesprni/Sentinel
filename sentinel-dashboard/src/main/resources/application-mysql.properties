# MySQL configuration (active with -Dspring.profiles.active=mysql)
sentinel.mysql.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/sentinel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mybatis/*.xml

# Machine heartbeat expiry threshold in seconds (default: 300 = 5 minutes)
sentinel.mysql.heartbeat-expire-seconds=300
